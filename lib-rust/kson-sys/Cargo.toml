[package]
name = "kson-sys"
# [[kson-version-num]]
version = "0.5.0-dev"
edition = "2024"
links = "kson"
description = "Rust bindings to kson-lib"
license = "Apache-2.0"

[features]
default = []
# Link kson-lib statically (macOS and Linux only), so binaries don't need libkson at runtime
static = []

[build-dependencies]
anyhow = "1.0.100"
bindgen = "0.73.2"
flate2 = "1.1.2"
tar = "0.4"
ureq = "3.1.2"
