[package]
name = "kson-rs"
# [[kson-version-num]]
version = "0.5.0-dev"
edition = "2024"
description = "Idiomatic Rust bindings to kson-lib"
license = "Apache-2.0"

[features]
default = []
# Link kson-lib statically (macOS and Linux only), see the readme
static = ["kson-sys/static"]

[dependencies]
# [[kson-version-num]]
kson-sys = { version = "0.5.0-dev", path = "../kson-sys" }

[dev-dependencies]
insta = "1.43.1"
